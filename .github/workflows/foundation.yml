name: Repository foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Phase 0 contract and documentation
        run: python3 scripts/validate_foundation.py
      - name: Check audit script syntax
        run: bash -n scripts/audit_macos.sh
      - name: Check committed whitespace
        run: git show --format= --check HEAD
