name: Repository foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate foundation contract and documentation
        run: python3 scripts/validate_foundation.py
      - name: Test repository tooling without downloads
        run: python3 -m unittest discover -s tests -v
      - name: Test dependency-free prototype model
        run: node --test design/prototype/model.test.js
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Check audit script syntax
        run: bash -n scripts/audit_macos.sh
      - name: Check committed whitespace
        run: git show --format= --check HEAD
