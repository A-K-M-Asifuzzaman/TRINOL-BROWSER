<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Trinol Orbit · Interactive design preview</title>
  <link rel="icon" href="../assets/orbit-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#page">Skip to page content</a>
  <div id="shell" class="shell">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Open demo tabs"></div>
      <button class="icon-button new-tab" data-action="new" aria-label="New tab" title="New tab (⌘T)"></button>
      <span class="window-label">Trinol Orbit</span>
      <button class="icon-button" data-action="layout" aria-label="Switch to vertical tabs" title="Explore tab layout"></button>
    </header>
    <div class="navigation" aria-label="Navigation toolbar" role="toolbar">
      <button class="icon-button" data-action="back" aria-label="Back"></button>
      <button class="icon-button" data-action="forward" aria-label="Forward"></button>
      <button class="icon-button" data-action="reload" aria-label="Reload"></button>
      <form id="address-form" class="address-wrap" role="search" aria-label="Address and search">
        <button type="button" class="site-button" data-action="site" aria-label="Demo site information"></button>
        <input id="address" autocomplete="off" spellcheck="false" aria-label="Address or search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" placeholder="Search or enter an address">
        <span id="address-hint" class="key">⌘ L</span>
        <button type="button" class="icon-button" data-action="bookmark" aria-label="Bookmark this demo tab" aria-pressed="false"></button>
        <div id="suggestions" class="suggestions" role="listbox" aria-label="Address suggestions" hidden></div>
      </form>
      <button class="icon-button" data-action="downloads" aria-label="Downloads"></button>
      <button class="profile-button" data-action="profile" aria-label="Demo profile">P</button>
      <button class="icon-button" data-action="menu" aria-label="Browser menu"></button>
    </div>
    <div class="body">
      <aside id="sidebar" class="sidebar" aria-label="Browser sidebar"></aside>
      <main id="page" class="page" tabindex="-1" role="tabpanel" aria-label="Demo page content"></main>
    </div>
    <footer class="preview-bar"><span><b class="preview-dot"></b>Interactive design preview <span class="demo-note">· All browsing data is fictional</span></span><div><button data-action="commands">Commands <kbd>⌘ K</kbd></button><button data-action="theme" aria-label="Switch to light appearance"></button><button data-action="scenarios">Review states</button></div></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="panel" aria-labelledby="panel-title"></dialog>
</body>
</html>
